# ==============================================================================
# Rove · Nginx 主备自动容灾切换配置模版 (Mac 主节点 + PVE 通用备用节点)
# 部署位置: 网关节点 /etc/nginx/conf.d/walking-workstation.conf
# 效果: 正常情况下优先路由至主工作站 (如 192.168.1.100:8765)；
#       当主工作站关机、休眠故障或维护不可达时，自动无缝切换至 PVE 通用节点 (backup)！
# ==============================================================================
map $http_upgrade $workstation_connection {
    default upgrade;
    '' close;
}

upstream walking_workstation_cluster {
    # 主节点: Mac 工作站局域网地址 (请替换为实际 IP)
    server 192.168.1.100:8765 max_fails=2 fail_timeout=5s;
    # 备用容灾节点: PVE 通用工作台节点 (请将 IP 替换为 PVE LXC 容器或本机地址)
    server 127.0.0.1:8765 backup;
    keepalive 16;
}

server {
    listen 127.0.0.1:8086;
    server_name rove.example.com;
    access_log off;
    client_max_body_size 50m;

    location / {
        proxy_pass http://walking_workstation_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $workstation_connection;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 3s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
